[package]
name = "hotcell"
version = "0.1.0"
edition = "2021"
description = "An AI coding agent sandbox"
license = "MIT"

[[bin]]
name = "hotcell"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
