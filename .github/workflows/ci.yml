name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install bubblewrap (bwrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version

      # Ubuntu 24.04 (ubuntu-latest) ships with AppArmor's
      # apparmor_restrict_unprivileged_userns=1, which blocks unprivileged
      # user namespaces. bwrap then can't get CAP_NET_ADMIN in the network
      # namespace it creates for --unshare-net, so loopback setup fails with
      # "loopback: Failed RTM_NEWADDR: Operation not permitted". Relaxing this
      # single sysctl lets bwrap set up the net ns (and bring up lo) the same
      # way it does on a normal workstation; the --unshare-net sandbox the
      # tests exercise is unchanged.
      - name: Allow unprivileged user namespaces (for bwrap --unshare-net)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Smoke-test: bring up a net ns and run a trivial program.
          bwrap --unshare-net --dev-bind / / -- /bin/true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build (debug)
        run: cargo build --all-targets --all-features

      - name: Build (release)
        run: cargo build --release --all-targets

      - name: Test
        run: cargo test --all-targets --all-features

  release-artifacts:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Stage artifact
        run: |
          mkdir -p staging
          cp target/release/hotcell staging/hotcell
          strip --strip-unneeded staging/hotcell || true
          tar -C staging -czf hotcell-x86_64-unknown-linux-gnu.tar.gz hotcell
          shasum -a 256 hotcell-x86_64-unknown-linux-gnu.tar.gz > hotcell-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotcell-x86_64-unknown-linux-gnu
          path: |
            hotcell-x86_64-unknown-linux-gnu.tar.gz
            hotcell-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
